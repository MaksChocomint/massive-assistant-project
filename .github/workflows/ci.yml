name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Тесты с покрытием (не ниже 70 %)
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d assistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Миграции вверх
        run: alembic upgrade head
      - name: ETL два раза (идемпотентность)
        run: |
          python -m app.etl.import_massive --source tests/fixtures/sample.csv
          python -m app.etl.import_massive --source tests/fixtures/sample.csv
      - name: Откат миграций
        run: alembic downgrade base

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, migrations, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск с автоматическим наполнением БД
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Проверка API и интерфейса
        run: |
          curl --fail http://localhost:8000/api/health
          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/api/speech/status
          python - <<'PY'
          import json
          from urllib.request import urlopen
          with urlopen('http://localhost:8000/api/intents?limit=1') as response:
              assert json.load(response)['total'] == 60
          with urlopen('http://localhost:8000/api/users') as response:
              assert len(json.load(response)) == 3
          PY
      - name: Логи контейнеров
        if: always()
        run: docker compose logs
      - name: Остановка стенда
        if: always()
        run: docker compose down
